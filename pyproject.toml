[project]
name = "blastmap"
version = "1.2.0"
description = "Tritura microsserviços em documentação semântica enxuta, servida a agentes via MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "jsonschema>=4.21.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "vulture>=2.11",
]

[project.scripts]
blastmap = "blastmap.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blastmap*"]

[tool.setuptools.package-data]
blastmap = ["db/schema.sql", "generation/prompts/*.md", "generation/schemas/*.json"]

[tool.coverage.run]
source = ["blastmap"]
# get_relationships/find_change_surface are exercised via a subprocess MCP server
# (tests/test_mcp_*.py drive it over real stdio), so coverage must follow across the
# process boundary: parallel + the COVERAGE_PROCESS_START env var + a `coverage.pth`
# startup hook in the interpreter's site-packages (see CONTRIBUTING notes / README).
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
