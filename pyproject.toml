[project]
name = "context-insight"
version = "0.4.0"
description = "Tritura microsserviços em documentação semântica enxuta, servida a agentes via MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "jsonschema>=4.21.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
context-insight = "context_insight.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_insight*"]

[tool.setuptools.package-data]
context_insight = ["db/schema.sql", "generation/prompts/*.md", "generation/schemas/*.json"]
