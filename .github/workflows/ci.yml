name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install orbitkb with dev dependencies
        run: pip install -e ".[dev]"

      # No claude/codex CLI is available (or authenticated) in CI, so the suite
      # never shells out to a real LLM backend — every test either fakes the
      # LLMBackend protocol or seeds SQLite directly via db.repository. The one
      # test that needs a real indexed DB (tests/test_mcp_tools.py) self-skips
      # when verify/sample_project.db isn't present, which is the case here.
      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest tests/ -v
          python -m coverage report -m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install orbitkb with dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff (unused imports/variables)
        run: ruff check --select F401,F841 orbitkb tests scripts

      - name: vulture (dead code)
        run: vulture orbitkb --min-confidence 80

  integration-containers:
    name: Container integration E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install orbitkb with dev dependencies
        run: pip install -e ".[dev]"

      - name: Exercise RabbitMQ, Postgres and MongoDB containers
        run: make integration-containers
