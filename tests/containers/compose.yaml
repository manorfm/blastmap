name: orbitkb-container-e2e

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "127.0.0.1::15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbitkb
      POSTGRES_USER: orbitkb
      POSTGRES_PASSWORD: orbitkb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitkb -d orbitkb"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns,s3,events
      # LocalStack accepts any credentials, but the AWS CLI still refuses to run
      # without something configured — dummy values, never real credentials.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
